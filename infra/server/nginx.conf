# nginx in front of the web application (docs/operations.md, "On a Linux
# server"): TLS, the public address, and a wall around the routes only the
# runner may use. The certificate has to exist before `nginx -t` accepts
# this file, so get it first, with nginx's default site still in place:
#
#   sudo certbot certonly --nginx -d factory.example.com
#   sudo cp infra/server/nginx.conf /etc/nginx/sites-available/code-factory
#   sudo sed -i 's/factory\.example\.com/YOUR-DOMAIN/g' /etc/nginx/sites-available/code-factory
#   sudo ln -s /etc/nginx/sites-available/code-factory /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Delete the two `listen [::]` lines on a machine with IPv6 turned off; nginx
# will not start with them there.
#
# Checked with nginx 1.24 (Ubuntu 24.04's) in front of the production build:
# a first account and signed-in pages, a form from another origin refused, a
# 5 MB upload accepted and an 11 MB one refused, the runner's routes refused
# from outside, and a live-update notification through in under 0.1 s.

upstream code_factory_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name factory.example.com;

    # Let's Encrypt's HTTP challenge; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name factory.example.com;

    ssl_certificate     /etc/letsencrypt/live/factory.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/factory.example.com/privkey.pem;

    # Equal to BODY_SIZE_LIMIT in /etc/code-factory/factory.env.
    client_max_body_size 10m;

    # Only the runner calls these, and it calls the application directly on
    # 127.0.0.1:3000 (CALLBACK_BASE_URL), never through here. Among them is
    # the exchange that hands out a run's git token and model key; nobody on
    # the internet has any business reaching it.
    location ^~ /api/hooks/ {
        return 404;
    }
    location ^~ /api/runs/ {
        return 404;
    }

    location / {
        proxy_pass http://code_factory_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The address people use. ORIGIN is what forms are checked against,
        # but the application also builds its own links from this.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run page holds a live-update stream open, with a heartbeat every
        # 20 seconds; the application already asks nginx not to buffer it.
        proxy_read_timeout 1h;
    }
}
