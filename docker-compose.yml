# Postgres, and nothing else.
#
# n8n used to be here too, and every address between it and the two services
# had to be spelt twice — once as a browser reaches it and once as a container
# reaches the host it runs on. `bun run dev` now starts n8n on this machine
# directly, so `localhost` means the same thing everywhere. Runs execute as
# processes on this machine by default as well; Docker is needed only for
# `EXECUTION_HOST=docker` and for the Run it card, which publishes a port.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factory
    ports:
      - '5432:5432'
    volumes:
      - factory-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

volumes:
  factory-pg:
